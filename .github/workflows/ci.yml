name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GOOGLE_CLOUD_LOCATION: us-central1
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --extra dev --extra textarena --extra providers --extra preflight
      - run: |
          mkdir -p .ci-bin
          printf '#!/usr/bin/env sh\nexit 0\n' > .ci-bin/gemini
          chmod +x .ci-bin/gemini
          echo "$PWD/.ci-bin" >> "$GITHUB_PATH"
      - run: bash scripts/check_release_tree.sh
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run pytest -q
      - run: uv build
